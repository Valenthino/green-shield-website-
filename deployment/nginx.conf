server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain application/xml;
    gzip_min_length 1024;

    # The products page moved from /cocoa/ (it covers coffee, cocoa and cashew).
    location ~ ^/(en|fr)/cocoa/?$ {
        return 301 /$1/products/;
    }

    # Next.js build files have a content hash in their name: cache them for a year.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    location /images/ {
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;
}
